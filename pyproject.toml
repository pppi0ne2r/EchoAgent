[project]
name = "echo-agent"
version = "0.1.0"
description = "A CTF/pentest agent project state server and dispatcher."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
crypto-verify = ["pycryptodome==3.24.1"]

[project.scripts]
echo-agent = "echo_agent.__main__:main"
echo-agent-server = "echo_agent.server.cli:main"
echo-agent-dispatcher = "echo_agent.dispatcher.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["echo_agent*"]

[tool.setuptools.package-data]
"echo_agent.server" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EchoAgent Console</title>
    <link rel="stylesheet" href="/static/styles.css?v=24" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>EchoAgent</h1>
        <p>CTF / 渗透项目调度控制台</p>
      </div>
      <div class="topbar-actions">
        <button id="open-settings" class="ghost-button" type="button">配置</button>
        <div class="status-line" id="connection-status">connecting</div>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="section-header">
          <h2>项目</h2>
          <div class="sidebar-actions">
            <button id="open-create" type="button">新建</button>
            <button id="stop-all" class="danger ghost-stop" type="button">全部停止</button>
          </div>
        </div>
        <div id="project-list" class="project-list"></div>
      </aside>

      <section class="workspace">
        <div class="project-header">
          <div class="project-heading">
            <h2 id="project-title">选择项目</h2>
            <p id="project-subtitle">查看任务输入、fact / intent 图和运行状态</p>
          </div>
          <div class="actions">
            <button id="edit-project" type="button" disabled>编辑</button>
            <button id="run-project" type="button" disabled>运行</button>
            <button id="stop-project" type="button" disabled>停止</button>
            <button id="delete-project" class="danger" type="button" disabled>删除</button>
          </div>
        </div>

        <div class="summary-row" id="summary-row">
          <div><span>状态</span><strong>-</strong></div>
          <div><span>目标</span><strong>-</strong></div>
          <div><span>图</span><strong>-</strong></div>
          <div><span>调度</span><strong>-</strong></div>
        </div>

        <div class="graph-shell">
          <div id="graph-viewport" class="graph-viewport">
            <svg id="project-graph" viewBox="0 0 900 520" role="img" aria-label="项目图"></svg>
          </div>
          <div id="graph-detail" class="graph-detail empty-detail">点击 fact 节点或 intent 边查看详情</div>
        </div>
      </section>

      <aside class="logs-panel">
        <div class="section-header">
          <h2>日志</h2>
          <div class="actions">
            <label class="log-filter" title="显示 Codex 详细输出">
              <input id="show-detail-logs" type="checkbox" />
              详细
            </label>
            <button id="refresh-logs" type="button" disabled>刷新</button>
            <button id="clear-logs" class="danger" type="button" disabled>清空</button>
          </div>
        </div>
        <div id="run-status-bar" class="run-status-bar">未选择项目</div>
        <div id="log-list" class="log-list"></div>
      </aside>
    </main>

    <dialog id="create-dialog">
      <form id="create-project-form" class="project-form" novalidate>
        <div class="dialog-header">
          <h2 id="create-dialog-title">创建项目</h2>
          <button id="close-create" class="ghost-button" type="button">关闭</button>
        </div>
        <div class="dialog-body">
          <label>
            项目名称
            <input name="name" type="text" maxlength="80" placeholder="例如：web-easy、pwn-heap" required />
          </label>
          <fieldset class="choice-group">
            <legend>目标</legend>
            <div class="choice-row">
              <label class="check-label"><input name="use_url" type="checkbox" /> URL</label>
              <label class="check-label"><input name="use_ip" type="checkbox" /> IP</label>
              <label class="check-label"><input name="use_attachment" type="checkbox" /> 附件</label>
            </div>
          </fieldset>
          <div id="target-url-field" hidden>
            <label>
              URL
              <input name="target_url" type="text" placeholder="https://target.example" />
            </label>
          </div>
          <div id="target-ip-field" hidden>
            <label>
              IP
              <input name="target_ip" type="text" placeholder="10.0.0.8 或 10.0.0.8:9999" />
            </label>
          </div>
          <div id="target-file-field" hidden>
            <label>
              上传附件
              <input name="attachment" type="file" />
            </label>
            <p class="field-note">可以和 URL 或 IP 一起使用。启动后在容器内直接读取。</p>
            <p id="attachment-note" class="field-note" hidden></p>
          </div>
          <label class="check-label hint-toggle">
            <input name="use_hint" type="checkbox" />
            填写 Hint
          </label>
          <div id="hint-field" hidden>
            <label>
              Hint
              <textarea name="hint" rows="3" placeholder="题目提示、范围或账号信息"></textarea>
            </label>
          </div>
          <label>
            目的
            <textarea name="objective" rows="4" required>获取 flag，并说明利用路径。</textarea>
          </label>
        </div>
        <p id="create-error" class="form-error" hidden></p>
        <div class="dialog-actions">
          <button id="cancel-create" class="ghost-button" type="button">取消</button>
          <button id="submit-create" type="submit">创建</button>
        </div>
      </form>
    </dialog>

    <dialog id="settings-dialog">
      <form id="settings-form" class="settings-form">
        <div class="dialog-header">
          <h2>运行配置</h2>
          <button id="close-settings" class="ghost-button" type="button">关闭</button>
        </div>
        <div class="dialog-body">
          <p class="settings-note">同时运行几个项目，和每个项目里同时跑几个 Codex，是两个独立限制。一个项目同时执行的 intent 数与它的 Codex 数相同。保存后只影响之后启动的项目；环境变量仍然优先。</p>
          <label>
            同时运行的项目数
            <input name="max_concurrent_projects" type="number" min="1" step="1" required />
          </label>
          <label>
            每个项目同时运行的 Codex 数
            <input name="codex_max_slots" type="number" min="1" step="1" required />
          </label>
          <label>
            Codex Base URL
            <input name="base_url" type="url" required />
          </label>
          <label>
            Codex Model
            <input name="model" type="text" required />
          </label>
          <label>
            Codex API Key
            <input name="api_key" type="password" autocomplete="off" placeholder="留空表示不修改" />
          </label>
          <p id="api-key-hint" class="settings-note"></p>
          <label class="check-label hint-toggle">
            <input name="clear_api_key" type="checkbox" />
            清除已保存的 API Key
          </label>
        </div>
        <div class="dialog-actions">
          <button type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <script src="/static/app.js?v=31"></script>
  </body>
</html>
